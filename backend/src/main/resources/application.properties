spring.application.name=gymfit-api
spring.config.import=optional:file:.env[.properties],optional:file:./backend/.env[.properties]
server.address=127.0.0.1
server.port=3001
spring.sql.init.mode=always
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=GYMFIT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${GYMFIT_SECURE_COOKIE:false}
server.servlet.session.tracking-modes=cookie

# The workspace tables continue to initialize idempotently from schema.sql.
# Flyway tracks the imported member-feature migrations on both new and existing workspace schemas.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
server.error.include-stacktrace=never
usda.api.key=${USDA_API_KEY:}
usda.api.base-url=${USDA_BASE_URL:https://api.nal.usda.gov/fdc/v1}
usda.api.cache-days=${USDA_CACHE_DAYS:30}
usda.api.min-request-interval-ms=${USDA_MIN_REQUEST_INTERVAL_MS:1000}
gymfit.reporting.time-zone=${REPORTING_TIME_ZONE:Asia/Kolkata}
gymfit.nutrition.deficit=${CALORIE_DEFICIT:300}
gymfit.nutrition.surplus=${CALORIE_SURPLUS:250}
gymfit.nutrition.minimum-calories=${MINIMUM_CALORIES:1500}
gymfit.nutrition.maximum-calories=${MAXIMUM_CALORIES:4000}
